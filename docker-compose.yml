services:
  postgres:
    image: postgres:17
    container_name: bhaiway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bhaiway
      POSTGRES_PASSWORD: bhaiway_dev_password
      POSTGRES_DB: bhaiway
    ports:
      - "5432:5432"
    volumes:
      - bhaiway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhaiway -d bhaiway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: bhaiway-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - bhaiway_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bhaiway_postgres_data:
  bhaiway_redis_data: