
name: Deploy BhaiWay Backend

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy to production after build and upload
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bhaiway-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS application
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s dist/main.js
          test -s dist/database/data-source.js
          test -d dist/database/migrations
          echo "Build output verified."

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/bhaiway_key
          chmod 600 ~/.ssh/bhaiway_key

          if [[ -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "ERROR: VPS_KNOWN_HOSTS secret is missing."
            exit 1
          fi

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote upload directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/bhaiway_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/bhaiway-deploy/incoming/dist'

      - name: Transfer build using rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          rsync -az --delete \
            -e "ssh -i ~/.ssh/bhaiway_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p $VPS_PORT" \
            dist/ \
            "$VPS_USER@$VPS_HOST:/opt/bhaiway-deploy/incoming/dist/"

          echo "Build transferred successfully."

      - name: Transfer production dependency manifests
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          test -s package.json
          test -s package-lock.json

          rsync -az \
            -e "ssh -i ~/.ssh/bhaiway_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p $VPS_PORT" \
            package.json package-lock.json \
            "$VPS_USER@$VPS_HOST:/opt/bhaiway-deploy/incoming/"

          echo "Verifying uploaded manifests..."

          ssh -i ~/.ssh/bhaiway_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'test -s /opt/bhaiway-deploy/incoming/package.json &&
             test -s /opt/bhaiway-deploy/incoming/package-lock.json &&
             echo "Both manifests verified."'

      - name: Deploy on VPS
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/bhaiway_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'sudo /usr/local/sbin/deploy-bhaiway'
